name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test the production server
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/robots.txt >/dev/null && break; sleep 1; done
          for path in / /robots.txt /sitemap.xml /json-en /resume-en; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")"
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -sI http://127.0.0.1:3000/ | grep -i '^x-frame-options: DENY'
          npm run test:a11y
